<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roommates Ledger</title>
<style>
:root{--navy:#12345a;--blue:#1769d2;--bg:#f3f6fa;--card:#fff;--ink:#17263b;--mut:#53657d;--line:#dce4ee;--green:#16783a;--red:#ae2929;--gbg:#e8f5ec;--rbg:#fff0ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:8px max(12px,calc((100vw - 760px)/2));display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
header .who{font-size:13px}
main{max-width:760px;margin:0 auto;padding:12px 12px 76px}
h2{font-size:19px;line-height:1.3;margin:2px 0 6px}h3{font-size:16px;margin:14px 0 6px}
.intro{color:var(--mut);margin:0 0 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{border-radius:11px;padding:10px;border:1px solid var(--line);background:#fff}
.stat small{display:block;color:var(--mut);font-size:12px}.stat b{display:block;font-size:18px;margin-top:2px;direction:ltr;text-align:left}
.stat.g{background:var(--gbg)}.stat.g b{color:var(--green)}.stat.r{background:var(--rbg)}.stat.r b{color:var(--red)}
.stat-button{width:100%;min-height:76px;padding:8px;text-align:left;background:#fff;color:var(--ink);border-color:var(--line)}
.stat-button small{font-size:11px;line-height:1.2}
.stat-button b{font-size:16px}
.stat-button .stat-status{margin-top:3px}
button,.btn{font:inherit;font-weight:650;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;min-height:42px}
button.alt{background:#fff;color:var(--blue)}button.warn{background:#fff;color:var(--red);border-color:#e4b7b7}
button.sm{padding:6px 10px;min-height:36px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #90b8f5;outline-offset:2px}
.profiles{display:grid;gap:12px;grid-template-columns:1fr}
.profile{background:#fff;color:var(--navy);border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:17px;text-align:left}
.profile:hover{border-color:var(--blue)}
label{display:block;font-weight:650;margin:10px 0 0;font-size:14px}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid #aebdd0;border-radius:8px;margin-top:4px;background:#fff;color:var(--ink)}
input[type=number],input[type=date]{direction:ltr;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1 1 180px!important}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.room-choice{border:1px solid var(--line);border-radius:9px;padding:8px;margin:10px 0}
.room-choice legend{font-weight:650;padding:0 5px}
.check-row{display:flex;align-items:center;gap:8px;margin:2px 0;padding:6px;border-bottom:1px solid var(--line)}
.check-row input{width:18px;height:18px;margin:0;flex:0 0 auto}
.check-row span{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:1}
.check-row small{color:var(--mut);font-weight:400}
.room-card{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:6px 0;padding:9px 12px}
.room-card .room-balance{display:block;font-size:12px;color:var(--mut);font-weight:500}.room-card b{font-size:15px}
.tx-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}
.tx-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tx-top b{font-size:14px}.tx-amount{direction:ltr;white-space:nowrap;font-weight:700}
.tx-meta{color:var(--mut);font-size:12px;margin-top:3px}.tx-actions{display:flex;gap:7px;margin-top:7px}
.mut{color:var(--mut);font-size:13px}.tag{font-size:12px;background:#e8eefb;color:var(--navy);border-radius:6px;padding:2px 7px}
.note{background:#fff8e1;border:1px solid #f1d98a;border-radius:10px;padding:10px;font-size:13px}
.bottom-nav{position:fixed;inset:auto 0 0;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.bottom-nav button{min-height:42px;padding:6px 4px;background:#fff;color:var(--navy);border-color:transparent;font-size:14px}
.bottom-nav button.on{background:#e8f0fb;color:var(--navy);border-color:#c9d9ef}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.58);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px}
@media(min-width:640px){main{padding-top:18px}.ov{align-items:center}.sheet{border-radius:14px}}
@media(max-width:380px){main{padding-inline:10px}.stat{padding:8px}.stat b{font-size:16px}.actions{grid-template-columns:1fr 1fr}.room-card{padding:8px}.bottom-nav{gap:4px}}
.toast{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:9px;z-index:30;max-width:92%;text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='roommates_ledger_v1',UK='roommates_ledger_user';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const fdate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const ftime=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'});
const money=p=>'Rs. '+(Math.abs(p)/100).toLocaleString('en-PK',{minimumFractionDigits:Math.abs(p)%100?2:0,maximumFractionDigits:2});
const toPaisa=v=>{const n=Number(v);return Number.isFinite(n)?Math.round(n*100):NaN};
const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+'T00:00:00').getTime())&&iso(new Date(d+'T00:00:00'))===d;

let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.roommates)||!Array.isArray(S.txs)){S={roommates:['M. Suleman','M. Youaan','Shamshad','Ihsan'].map(n=>({id:uid(),name:n})),txs:[]};save()}
let me=null;try{me=localStorage.getItem(UK)}catch(e){}
if(me&&!S.roommates.some(r=>r.id===me))me=null;
// Ihsan is the default ledger owner on first open
if(!me){const ih=S.roommates.find(r=>r.name==='Ihsan');if(ih){me=ih.id;try{localStorage.setItem(UK,me)}catch(e){}}}
let ui={view:'home',acct:null};
let backPressedAt=0;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert('Could not save your data. Free some browser storage and try again.');return false}}
const nm=id=>{const r=S.roommates.find(x=>x.id===id);return r?r.name:'Unknown'};
const sgn=t=>((t.kind==='item')===(t.dir==='in'))?1:-1;
const mine=a=>S.txs.filter(t=>t.owner===me&&t.account===a).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:x.created-y.created);
const net=(a,ex)=>mine(a).filter(t=>t.id!==ex).reduce((s,t)=>s+sgn(t)*t.amount,0);
const others=()=>S.roommates.filter(r=>r.id!==me);
function balText(n,a){return n>0?`${nm(a)} owes you ${money(n)}`:n<0?`You owe ${nm(a)} ${money(-n)}`:'All paid'}
function balCls(n){return n>0?'pos':n<0?'neg':'mut'}
function detail(t){return t.kind==='item'?t.desc+(t.qty?' ('+t.qty+')':''):t.dir==='in'?'Payment received':'Payment made'}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function modal(h){closeModal();const o=document.createElement('div');o.className='ov';o.id='modal';o.innerHTML='<div class="sheet">'+h+'</div>';o.addEventListener('mousedown',e=>{if(e.target===o)closeModal()});document.body.appendChild(o)}
function closeModal(){const o=$('#modal');if(o)o.remove()}
function keepAppHistory(){history.pushState({roommatesLedger:true},'')}
window.addEventListener('popstate',()=>{
  if($('#modal')){closeModal();backPressedAt=0;keepAppHistory();return}
  if(me&&ui.view!=='home'){ui.view='home';ui.acct=null;backPressedAt=0;render();keepAppHistory();return}
  if(Date.now()-backPressedAt<2000){backPressedAt=0;return}
  backPressedAt=Date.now();toast('Press back again to exit.');keepAppHistory();
});

/* ---------- Rendering ---------- */
function render(){
  const app=$('#app');
  if(!me){
    app.innerHTML=`<header><h1>Roommates Ledger</h1></header><main><h2>Who are you?</h2><p class="intro">Tap your name to open your ledger.</p><div class="profiles">${S.roommates.map(r=>`<button class="profile" data-a="pick" data-id="${r.id}">${esc(r.name)}</button>`).join('')}</div></main>`;return}
  const tabs=[['home','Dashboard'],['mates','Roommates'],['history','History']];
  let body='';
  if(ui.view==='home')body=home();else if(ui.view==='acct')body=acct();else if(ui.view==='history')body=historyView();else body=mates();
  app.innerHTML=`<header><h1>Roommates Ledger</h1><span class="who">${esc(nm(me))}</span><button class="sm" data-a="switch">Switch</button></header>
  <main>${body}</main><nav class="bottom-nav">${tabs.map(t=>`<button class="${ui.view===t[0]||(ui.view==='acct'&&t[0]==='home')?'on':''}" data-a="nav" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav>`;
  if(ui.view==='acct')renderList();
}
function home(){
  const balances=others().map(r=>({roommate:r,balance:net(r.id)}));
  const expenses=S.txs.filter(t=>t.owner===me&&t.kind==='item'&&t.dir==='in').reduce((sum,t)=>sum+t.amount,0);
  const cards=balances.map(({roommate:r,balance:n})=>{
    const status=n>0?'Owes you':n<0?'Advance left':'All paid';
    return `<button class="stat stat-button" data-a="open" data-id="${r.id}"><small>${esc(r.name)}</small><b class="${n<0?'pos':balCls(n)}">${money(Math.abs(n))}</b><small class="stat-status">${status}</small></button>`}).join('');
  return `<h2>Dashboard</h2>
  <div class="grid">${cards}<div class="stat"><small>Total expenses you paid</small><b>${money(expenses)}</b></div></div>
  <div class="actions"><button data-a="form" data-k="item">+ Add expense</button><button class="alt" data-a="form" data-k="payment">Add advance / payment</button></div>
  ${balances.length?'':'<p class="mut">Add a roommate to get started.</p>'}`;
}
function runRows(a){let b=0;return mine(a).map(t=>{b+=sgn(t)*t.amount;return{t,b}})}
function acct(){
  const a=ui.acct,n=net(a);
  return `<button class="alt sm" data-a="nav" data-v="home">← Dashboard</button><h2 style="margin-top:10px">${esc(nm(a))}</h2>
  <div class="card"><div class="mut">${n>0?'Owed to you':n<0?'Advance left':'All paid'}</div><div class="${n<0?'pos':balCls(n)}" style="font-size:22px;direction:ltr;text-align:left;font-weight:700">${money(Math.abs(n))}</div></div>
  <div class="actions"><button data-a="form" data-k="item" data-acct="${a}" data-dir="in">+ Add expense</button><button class="alt" data-a="form" data-k="payment" data-acct="${a}">Add advance / payment</button></div>
  <button class="alt" style="width:100%;margin-bottom:8px" data-a="form" data-k="item" data-acct="${a}" data-dir="out">Record purchase for you</button>
  <button class="alt" style="width:100%" data-a="shareAccount">Share image on WhatsApp</button>
  <h3>Recent activity</h3><div id="list"></div>`;
}
function renderList(){
  const rows=runRows(ui.acct).reverse();
  $('#list').innerHTML=rows.length?rows.map(({t,b})=>`<div class="tx-card"><div class="tx-top"><b>${esc(detail(t))}</b><span class="tx-amount ${sgn(t)>0?'pos':'neg'}">${sgn(t)>0?'+':'−'}${money(t.amount)}</span></div><div class="tx-meta">${fdate(t.date)}${t.kind==='payment'?' · '+ftime(t.created):''} · Balance ${b<0?'−':''}${money(b)}</div><div class="tx-actions"><button class="alt sm" data-a="form" data-id="${t.id}">Edit</button><button class="warn sm" data-a="del" data-id="${t.id}">Delete</button></div></div>`).join(''):'<p class="mut">No entries yet. Add an expense to get started.</p>';
}
function mates(){
  return `<h2>Roommates</h2><p class="intro">Open a roommate ledger or manage names.</p><div class="card">${S.roommates.map(r=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><b class="grow">${esc(r.name)}${r.id===me?' <span class="tag">You</span>':''}</b>${r.id!==me?`<button class="alt sm" data-a="open" data-id="${r.id}">Open</button>`:''}<button class="alt sm" data-a="ren" data-id="${r.id}">Rename</button>${r.id!==me?`<button class="warn sm" data-a="rem" data-id="${r.id}">Remove</button>`:''}</div>`).join('')}
  <label for="newName">Add a roommate</label><div class="row" style="margin-top:6px"><input class="grow" id="newName" placeholder="Name"><button data-a="add">Add</button></div></div>`;
}
function historyView(){
  const entries=S.txs.filter(t=>t.owner===me);
  return `<h2>History</h2><p class="intro">Delete saved records for one roommate or clear your full history. Each deletion asks for confirmation twice.</p>
  <div class="card"><h3 style="margin-top:0">By roommate</h3>${others().map(r=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><b class="grow">${esc(r.name)}</b><span class="mut">${mine(r.id).length} entries</span><button class="warn sm" data-a="delHistory" data-id="${r.id}">Delete history</button></div>`).join('')||'<p class="mut">No roommates found.</p>'}</div>
  <div class="card"><h3 style="margin-top:0">All history</h3><p class="intro">${entries.length} entries in your ledger. Roommate names and other people's ledgers are not deleted.</p><button class="warn" style="width:100%" data-a="delAllHistory">Delete all my history</button></div>`;
}

/* ---------- Forms ---------- */
function form(kind,id,acctId,expenseDir){
  const t=id?S.txs.find(x=>x.id===id&&x.owner===me):null;if(id&&!t)return toast('This transaction is not available in the current ledger.');
  if(t)kind=t.kind;
  if(!others().length)return toast('Add a roommate first.');
  const it=kind==='item',sel=t?t.account:(acctId||(ui.view==='acct'?ui.acct:null));
  const dir=t?t.dir:(expenseDir||'in');
  const checkedAccounts=t?[t.account]:sel?[sel]:[];
  modal(`<h2>${t?'Edit entry':it?(dir==='out'?'Record purchase for you':'Add expense'):'Add advance / payment'}</h2><p class="intro">${it?(dir==='out'?'Select who bought for you. The amount is recorded for each selected roommate.':'Select who this expense was for. The amount is recorded for each selected roommate. Any advance from them is reduced automatically.'):'Select one or more roommates. The amount is applied to each selected roommate.'}</p><form id="f" data-kind="${kind}" data-id="${id||''}" data-dir="${dir}">
  <fieldset class="room-choice"><legend>${it?'Who was it for?':'Roommates'}</legend>${t?`<input type="hidden" name="accounts" value="${esc(t.account)}"><div class="mut">${esc(nm(t.account))}</div>`:others().map(r=>`<label class="check-row"><input type="checkbox" name="accounts" value="${r.id}" ${checkedAccounts.includes(r.id)?'checked':''}><span>${esc(r.name)} <small>Balance: ${money(net(r.id))}</small></span></label>`).join('')}
  ${!it?`<label>Payment type<select name="paymentDirection"><option value="in" ${!t||t.dir==='in'?'selected':''}>Received from roommate (advance or repayment)</option><option value="out" ${t&&t.dir==='out'?'selected':''}>Paid to roommate</option></select></label>`:''}
  </fieldset>
  ${it?`<label>What was it for? (optional)<input name="desc" maxlength="80" value="${esc(t?t.desc:'')}" placeholder="e.g. Groceries"></label>`:''}
  <label>Amount (Rs.)<input name="amount" type="number" inputmode="decimal" step="0.01" min="0.01" max="999999999.99" required value="${t?t.amount/100:''}" placeholder="e.g. 500"></label>
  ${!it?`<p class="mut">Payment date and time will be added automatically.</p>`:''}
  <input type="hidden" name="date" value="${t?t.date:today()}">
  ${it?`<input type="hidden" name="qty" value="${esc(t?t.qty:'')}"><input type="hidden" name="notes" value="${esc(t?t.notes:'')}">`:''}
  <div class="actions"><button type="submit">Save</button><button class="alt" type="button" data-a="close">Cancel</button></div></form>`);
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='f')return;e.preventDefault();
  const f=e.target,fd=new FormData(f),v=Object.fromEntries(fd),kind=f.dataset.kind,id=f.dataset.id;
  const accounts=fd.getAll('accounts').map(String);
  const amt=toPaisa(v.amount);
  if(!Number.isSafeInteger(amt)||amt<=0)return toast('Enter a valid amount greater than zero.');
  if(!accounts.length)return toast('Select at least one roommate.');
  if(accounts.some(account=>account===me||!S.roommates.some(r=>r.id===account)))return toast('Choose valid roommates.');
  if(kind==='item'&&!['in','out'].includes(f.dataset.dir))return toast('Choose a valid expense type.');
  if(kind==='payment'&&!['in','out'].includes(v.paymentDirection))return toast('Choose a payment direction.');
  if(kind==='item'&&!validDate(v.date))return toast('The date is invalid.');
  if(id&&!S.txs.some(t=>t.id===id&&t.owner===me))return toast('This entry is not available.');
  const now=Date.now(),dir=kind==='item'?f.dataset.dir:v.paymentDirection;
  if(id){const existing=S.txs.find(t=>t.id===id&&t.owner===me);Object.assign(existing,{account:accounts[0],dir,amount:amt,date:kind==='payment'?today():v.date,created:kind==='payment'?now:existing.created,notes:'',kind,desc:kind==='item'?(v.desc||'').trim()||'Expense':'Payment',qty:(v.qty||'').trim(),method:'',updated:now})}
  else accounts.forEach(account=>S.txs.push({id:uid(),owner:me,created:now,updated:now,account,dir,amount:amt,date:kind==='payment'?today():v.date,notes:'',kind,desc:kind==='item'?(v.desc||'').trim()||'Expense':'Payment',qty:(v.qty||'').trim(),method:''}));
  if(!save())return;closeModal();toast('Saved.');render();
});

/* ---------- Statements ---------- */
function fit(c,s,w){if(c.measureText(s).width<=w)return s;while(s.length>1&&c.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'}
function pngPages(a){
  const rows=runRows(a),W=1080,P=48,RH=72,PER=12,chunks=[];
  for(let i=0;i<rows.length;i+=PER)chunks.push(rows.slice(i,i+PER));
  if(!chunks.length)chunks.push([]);
  const balance=net(a);
  return Promise.all(chunks.map((pageRows,i)=>new Promise((res,rej)=>{
    const last=i===chunks.length-1,headerH=112,tableH=54,footerH=last?124:0;
    const H=headerH+tableH+pageRows.length*RH+footerH+24;
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');if(!c)return rej(new Error('Canvas is unavailable.'));
    c.fillStyle='#fff';c.fillRect(0,0,W,H);c.fillStyle='#0f2a4a';c.fillRect(0,0,W,headerH);
    c.fillStyle='#fff';c.font='bold 42px Arial,sans-serif';c.fillText(nm(a),P,70);
    let y=headerH;c.fillStyle='#e8eefb';c.fillRect(0,y,W,tableH);c.fillStyle='#1b3f6b';c.font='bold 23px Arial,sans-serif';
    c.fillText('Date',P,y+35);c.fillText('Description',P+190,y+35);c.textAlign='right';c.fillText('Amount',820,y+35);c.fillText('Balance',W-P,y+35);c.textAlign='left';y+=tableH;
    if(!rows.length){c.fillStyle='#53657d';c.font='23px Arial,sans-serif';c.fillText('No entries yet',P,y+40);y+=RH}
    pageRows.forEach(({t,b},k)=>{
      if(k%2){c.fillStyle='#f6f8fc';c.fillRect(0,y,W,RH)}
      c.fillStyle='#14213a';c.font='22px Arial,sans-serif';c.fillText(fdate(t.date),P,y+44);
      c.font='bold 23px Arial,sans-serif';c.fillText(fit(c,detail(t),350),P+190,y+43);
      c.textAlign='right';c.font='bold 22px Arial,sans-serif';c.fillStyle='#14213a';c.fillText((sgn(t)>0?'+':'−')+money(t.amount),820,y+43);
      c.fillStyle=b>0?'#15803d':b<0?'#b91c1c':'#53657d';c.fillText((b<0?'−':'')+money(b),W-P,y+43);c.textAlign='left';y+=RH;
    });
    if(last){
      y+=12;c.fillStyle='#f2f5fa';c.fillRect(P,y,W-2*P,96);c.strokeStyle='#dde4ee';c.strokeRect(P,y,W-2*P,96);
      c.fillStyle='#14213a';c.textAlign='left';c.font='bold 24px Arial,sans-serif';c.fillText('TOTAL DUE',P+18,y+38);
      c.fillStyle=balance>0?'#15803d':balance<0?'#b91c1c':'#14213a';c.font='bold 30px Arial,sans-serif';c.textAlign='right';c.fillText(money(balance),W-P-18,y+42);
      c.textAlign='left';c.fillStyle='#53657d';c.font='20px Arial,sans-serif';c.fillText(balance>0?'They owe you':balance<0?'You owe them':'All paid',P+18,y+72);
    }
    cv.toBlob(bl=>bl?res(bl):rej(new Error('Could not generate the statement image.')),'image/png');
  })));
}
function fileBase(a){
  return `roommates-ledger-${nm(a)}`.normalize('NFKD').replace(/[^\w-]+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();
}
async function statementImages(a=ui.acct){
  const blobs=await pngPages(a),base=fileBase(a);
  return blobs.map((b,i)=>new File([b],`${base}${blobs.length>1?`-${i+1}`:''}.png`,{type:'image/png'}));
}
function downloadFiles(files){
  files.forEach((file,i)=>setTimeout(()=>{
    const url=URL.createObjectURL(file),link=document.createElement('a');
    link.href=url;link.download=file.name;document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),30000);
  },i*350));
}
function shareFallback(files){
  downloadFiles(files);
  toast('Image downloaded. Attach it in WhatsApp to share.');
}
async function shareAccount(){
  const a=ui.acct;
  try{
    const files=await statementImages(a);
    let supported=false;
    try{supported=typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&navigator.canShare({files})}catch(e){supported=false}
    if(!supported){shareFallback(files);return}
    try{
      await navigator.share({files,title:`Roommates Ledger — ${nm(a)} statement`});
      toast('Choose WhatsApp to share the statement image.');
    }catch(e){
      if(e.name==='AbortError')return;
      shareFallback(files);
    }
  }catch(e){alert(e.message||'Could not generate the account statement.')}
}

/* ---------- Actions ---------- */
function act(a,d){
  switch(a){
    case 'pick':me=d.id;try{localStorage.setItem(UK,me)}catch(e){}ui.view='home';render();break;
    case 'switch':me=null;try{localStorage.removeItem(UK)}catch(e){}render();break;
    case 'nav':ui.view=d.v;render();break;
    case 'open':ui.acct=d.id;ui.view='acct';render();break;
    case 'form':form(d.k,d.id,d.acct,d.dir);break;
    case 'shareAccount':shareAccount();break;
    case 'close':closeModal();break;
    case 'del':{const t=S.txs.find(x=>x.id===d.id);
      if(confirm(`Delete ${detail(t)} for ${money(t.amount)}? This cannot be undone.`)){S.txs=S.txs.filter(x=>x.id!==d.id);if(save()){render();toast('Entry deleted.')}}break}
    case 'delHistory':{
      const roommate=S.roommates.find(r=>r.id===d.id);
      if(!roommate||roommate.id===me)return toast('Choose a valid roommate.');
      const entries=S.txs.filter(t=>t.owner===me&&t.account===roommate.id);
      if(!entries.length)return toast(`No history to delete for ${roommate.name}.`);
      if(confirm(`Delete all ${entries.length} history ${entries.length===1?'entry':'entries'} for ${roommate.name}?`)&&confirm(`Final confirmation: permanently delete ${roommate.name}'s history? This cannot be undone.`)){
        const previous=S.txs;S.txs=previous.filter(t=>!(t.owner===me&&t.account===roommate.id));
        if(save()){render();toast(`${roommate.name}'s history deleted.`)}else S.txs=previous;
      }break}
    case 'delAllHistory':{
      const entries=S.txs.filter(t=>t.owner===me);
      if(!entries.length)return toast('There is no history to delete.');
      if(confirm(`Delete all ${entries.length} history ${entries.length===1?'entry':'entries'} from your ledger?`)&&confirm("Final confirmation: permanently delete ALL your history? Roommate names and other people's ledgers stay. This cannot be undone.")){
        const previous=S.txs;S.txs=previous.filter(t=>t.owner!==me);
        if(save()){render();toast('All your history was deleted.')}else S.txs=previous;
      }break}
    case 'add':{const v=$('#newName').value.trim();if(!v)return toast('Enter a name.');
      if(S.roommates.some(r=>r.name.toLowerCase()===v.toLowerCase()))return toast('That name already exists.');
      S.roommates.push({id:uid(),name:v});if(save())render();break}
    case 'ren':{const r=S.roommates.find(x=>x.id===d.id);
      modal(`<h2>Rename roommate</h2><label>New name<input id="rn" value="${esc(r.name)}" maxlength="40"></label><div class="actions"><button data-a="renOk" data-id="${r.id}">Save</button><button class="alt" data-a="close">Cancel</button></div>`);break}
    case 'renOk':{const v=$('#rn').value.trim();if(!v)return toast('Enter a name.');
      if(S.roommates.some(r=>r.id!==d.id&&r.name.toLowerCase()===v.toLowerCase()))return toast('That name already exists.');
      S.roommates.find(r=>r.id===d.id).name=v;if(save()){closeModal();render()}break}
    case 'rem':{if(S.txs.some(t=>t.owner===d.id||t.account===d.id))return alert('This roommate has ledger entries and cannot be removed.');
      if(d.id===me)return alert('Switch to another user first.');
      if(S.roommates.length<=2)return alert('Keep at least two roommates.');
      if(confirm(`Remove ${nm(d.id)}?`)){S.roommates=S.roommates.filter(r=>r.id!==d.id);if(save())render()}break}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
render();
keepAppHistory();
</script>
